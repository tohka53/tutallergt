<mat-sidenav-container class="tc-shell" [class.compact-nav]="compactNav">
  <mat-sidenav class="tc-sidenav"
               [mode]="compactNav ? 'over' : 'side'"
               [opened]="navOpen"
               (openedChange)="navOpen = $event"
               [disableClose]="!compactNav"
               [fixedInViewport]="compactNav"
               [class.collapsed]="collapsed && !compactNav">
    <div class="tc-brand">
      <img [src]="settings.logoSrc" [alt]="settings.current.name" />
      <button *ngIf="compactNav" mat-icon-button class="close-nav" (click)="navOpen = false"
              aria-label="Cerrar menú">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <nav class="tc-nav">
      <a *ngFor="let item of nav" [routerLink]="item.link" routerLinkActive="active"
         [matTooltip]="!compactNav && collapsed ? item.label : ''" matTooltipPosition="right">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span *ngIf="!collapsed || compactNav">{{ item.label }}</span>
      </a>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="tc-header">
      <button mat-icon-button (click)="toggle()"
              [attr.aria-label]="compactNav ? 'Abrir menú' : 'Colapsar menú'">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">Portal del cliente</span>
      <span class="tc-spacer"></span>

      <button type="button" class="tc-user" [matMenuTriggerFor]="userMenu" aria-label="Menú de usuario">
        <mat-icon color="primary">account_circle</mat-icon>
        <span class="u-text">
          <span class="u-name">{{ user?.displayName }}</span>
          <span class="u-role">Cliente</span>
        </span>
        <mat-icon class="u-caret">arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="menu-user-head">
          <div class="u-name">{{ user?.displayName }}</div>
          <div class="u-role">Cliente</div>
        </div>
        <button mat-menu-item routerLink="/portal/profile">
          <mat-icon>person</mat-icon><span>Mis datos</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon><span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="tc-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
