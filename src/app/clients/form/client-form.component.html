<div class="tc-page">
  <div class="tc-page-header">
    <h1>{{ title }}</h1>
    <a mat-button routerLink="/app/clients"><mat-icon>arrow_back</mat-icon> Volver</a>
  </div>

  <div *ngIf="loading" class="tc-loading">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
  </div>

  <mat-card class="tc-card" *ngIf="!loading" style="max-width:820px;">
    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      <div class="tc-form-grid">
        <mat-form-field>
          <mat-label>Nombres</mat-label>
          <input matInput formControlName="firstName" />
          <mat-error>El nombre es obligatorio.</mat-error>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Apellidos</mat-label>
          <input matInput formControlName="lastName" />
          <mat-error>El apellido es obligatorio.</mat-error>
        </mat-form-field>
        <mat-form-field>
          <mat-label>NIT / CF</mat-label>
          <input matInput formControlName="taxId" />
          <mat-error>Requerido.</mat-error>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="phone" />
          <mat-error>Requerido.</mat-error>
        </mat-form-field>
        <mat-form-field>
          <mat-label>WhatsApp</mat-label>
          <input matInput formControlName="whatsapp" placeholder="502XXXXXXXX" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Correo electrónico</mat-label>
          <input matInput formControlName="email" type="email" />
          <mat-error *ngIf="form.controls.email.hasError('required')">Requerido.</mat-error>
          <mat-error *ngIf="form.controls.email.hasError('email')">Correo no válido.</mat-error>
        </mat-form-field>
        <mat-form-field class="tc-col-span-2">
          <mat-label>Dirección</mat-label>
          <input matInput formControlName="address" />
        </mat-form-field>
        <mat-form-field class="tc-col-span-2">
          <mat-label>Observaciones</mat-label>
          <textarea matInput formControlName="notes" rows="2"></textarea>
        </mat-form-field>
      </div>

      <mat-slide-toggle formControlName="active" color="primary" style="margin:6px 0 16px;">
        Cliente activo
      </mat-slide-toggle>

      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button mat-button type="button" (click)="cancel()">Cancelar</button>
        <button mat-raised-button class="tc-btn-primary" type="submit" [disabled]="saving">
          <mat-icon>save</mat-icon> {{ saving ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </mat-card>
</div>
