<h2 mat-dialog-title>{{ data ? 'Editar artículo' : 'Nuevo artículo del catálogo' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" novalidate>
    <div class="tc-form-grid" style="padding-top:8px;">
      <mat-form-field>
        <mat-label>Código interno</mat-label>
        <input matInput formControlName="code" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Tipo</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let t of types" [value]="t.value">{{ t.label }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field class="tc-col-span-2">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
        <mat-error>Requerido.</mat-error>
      </mat-form-field>
      <mat-form-field class="tc-col-span-2">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="category">
          <mat-option *ngFor="let c of catalog.categories" [value]="c">{{ c }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field *ngIf="form.controls.type.value !== 'labor'">
        <mat-label>Costo (lo que pagas)</mat-label>
        <input matInput type="number" formControlName="suggestedCost" />
        <mat-hint>No lo ve el cliente.</mat-hint>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Precio al cliente (Q)</mat-label>
        <input matInput type="number" formControlName="suggestedPrice" />
        <mat-error>Precio inválido.</mat-error>
      </mat-form-field>
    </div>
    <mat-slide-toggle formControlName="active" color="primary">Activo</mat-slide-toggle>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button class="tc-btn-primary" (click)="save()">Guardar</button>
</mat-dialog-actions>
