<div class="tc-page">
  <div class="tc-page-header">
    <h1>{{ base === '/portal' ? 'Mis vehículos' : 'Vehículos' }}</h1>
    <a mat-raised-button class="tc-btn-primary" [routerLink]="[base, 'vehicles', 'new']">
      <mat-icon>add</mat-icon> Nuevo vehículo
    </a>
  </div>

  <mat-card class="tc-card">
    <mat-form-field class="tc-full" style="margin-bottom:8px;">
      <mat-label>Buscar</mat-label>
      <input matInput [formControl]="search"
             [placeholder]="base === '/app' ? 'Placa, marca, modelo o propietario' : 'Placa, marca o modelo'" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div *ngIf="loading" class="tc-loading">
      <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    </div>

    <div *ngIf="!loading && !dataSource.data.length" class="tc-empty">
      <mat-icon>directions_car</mat-icon>
      <p>No hay vehículos registrados.</p>
    </div>

    <app-mobile-sort *ngIf="!loading && dataSource.data.length"
                     [dataSource]="dataSource" [options]="sortOptions"></app-mobile-sort>

    <div class="tc-table-wrap tc-cards" [hidden]="loading || !dataSource.data.length">
      <table mat-table [dataSource]="dataSource" matSort class="tc-table">
        <ng-container matColumnDef="plate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Placa</th>
          <td mat-cell *matCellDef="let v" class="tc-cell-title"><strong>{{ v.plate }}</strong></td>
        </ng-container>
        <ng-container matColumnDef="vehicle">
          <th mat-header-cell *matHeaderCellDef>Vehículo</th>
          <td mat-cell *matCellDef="let v" data-label="Vehículo">{{ v.brand }} {{ v.model }}</td>
        </ng-container>
        <ng-container matColumnDef="owner">
          <th mat-header-cell *matHeaderCellDef>Propietario</th>
          <td mat-cell *matCellDef="let v" data-label="Propietario">{{ ownerName(v) }}</td>
        </ng-container>
        <ng-container matColumnDef="year">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Año</th>
          <td mat-cell *matCellDef="let v" data-label="Año">{{ v.year }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let v" data-label="Estado">
            <span class="tc-chip" [ngClass]="v.active ? 'tc-chip--ok' : 'tc-chip--muted'">
              {{ v.active ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let v" class="tc-cell-actions" (click)="$event.stopPropagation()">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Acciones del vehículo">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item [routerLink]="[base, 'vehicles', v.id]"><mat-icon>visibility</mat-icon> Ver</button>
              <button mat-menu-item [routerLink]="[base, 'vehicles', v.id, 'edit']"><mat-icon>edit</mat-icon> Editar</button>
              <button mat-menu-item [routerLink]="[base, 'vehicles', v.id, 'history']"><mat-icon>history</mat-icon> Historial</button>
              <button mat-menu-item *ngIf="canDelete" (click)="remove(v)"><mat-icon>delete</mat-icon> Eliminar</button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="goDetail(row.id)" style="cursor:pointer;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10, 25, 50]" pageSize="10" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card>
</div>
