<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p style="white-space: pre-line; margin: 0;">{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">{{ data.cancelText || 'Cancelar' }}</button>
  <button mat-raised-button [color]="data.danger ? 'warn' : 'primary'" [mat-dialog-close]="true" cdkFocusInitial>
    {{ data.confirmText || 'Confirmar' }}
  </button>
</mat-dialog-actions>
